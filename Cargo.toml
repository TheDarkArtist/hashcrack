[package]
name = "hashcrack"
version = "0.2.0"
authors = ["TheDarkArtist"]
edition = "2021"
description = "A multi-algorithm, multi-threaded hash cracking tool"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
md-5 = "0.10"
sha-1 = "0.10"
sha2 = "0.10"
rayon = "1.8"
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = true
codegen-units = 1
